<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>L版えらび</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>L版えらび <span id="saved" class="saved" hidden>✓ 保存済み</span></h1>
    <button id="btnSummary" class="total" aria-label="選んだ枚数とまとめ">
      <svg viewBox="0 0 24 24" class="heart on"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span id="totalCount">0</span><small>枚</small>
    </button>
  </div>
  <nav id="months" class="months" aria-label="月"></nav>
  <div class="filters" role="tablist">
    <button data-f="all" class="on">すべて</button>
    <button data-f="sel">♥ 選んだ</button>
    <button data-f="unsel">未選択</button>
    <span id="monthInfo" class="minfo"></span>
  </div>
</header>

<div id="pcBanner" class="pc-banner" hidden>
  <div id="qr" class="qr"></div>
  <div>
    <b>スマホで開く</b>（同じWi-Fiで、カメラでQRを読み取り）
    <div><a id="lanUrl" href="#"></a></div>
    <small>開けないときは Windows のファイアウォールで Python の「プライベートネットワーク」を許可してください。</small>
  </div>
  <button id="pcBannerClose" class="x" aria-label="閉じる">×</button>
</div>

<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden></p>

<!-- 拡大ビュー -->
<div id="viewer" class="viewer" hidden>
  <div class="v-top">
    <button id="vClose" class="vbtn" aria-label="閉じる">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="v-title"><span id="vPos"></span><small id="vName"></small></div>
    <button id="vGuide" class="vbtn txt" aria-pressed="false">L版枠</button>
  </div>
  <div id="vStage" class="v-stage">
    <div id="vBox" class="v-box">
      <img id="vImg" alt="">
      <div id="vCrop" class="v-crop" hidden></div>
    </div>
    <button id="vPrev" class="v-nav prev" aria-label="前へ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="vNext" class="v-nav next" aria-label="次へ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="v-bottom">
    <span class="v-hint">2回タップで♥</span>
    <button id="vFav" class="fav-big" aria-pressed="false">
      <svg viewBox="0 0 24 24" class="heart"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      <span>印刷する</span>
    </button>
    <span id="vMonthCount" class="v-hint right"></span>
  </div>
</div>

<!-- まとめ -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">選んだ写真</h2>
      <button id="sheetClose" class="x" aria-label="閉じる">×</button>
    </div>
    <div class="sum-total"><b id="sumTotal">0</b> 枚 <small>L版</small></div>
    <ul id="sumList" class="sum-list"></ul>
    <div class="export">
      <h3>PCのフォルダにまとめる</h3>
      <p>選んだ写真を <code id="exportRoot"></code> の中に<br><code>L版印刷_日時\年-月\</code> としてコピーします（元の写真はそのまま）。</p>
      <label id="heicRow" class="chk"><input type="checkbox" id="convertHeic" checked> HEIC は JPEG に変換する（写真屋さん向け）</label>
      <button id="btnExport" class="primary">フォルダにまとめる</button>
      <p id="exportResult" class="result"></p>
    </div>
    <button id="btnRescan" class="ghost">写真フォルダを読み込み直す</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
