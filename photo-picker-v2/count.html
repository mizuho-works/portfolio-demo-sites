<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L判 月別の枚数</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --ink:#111; --mute:#8e8e93; --bar:#ff6b81; --bar2:#ffb3c0; --line:#e5e5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --ink:#f2f2f7; --mute:#8e8e93; --bar:#ff6b81; --bar2:#5c2a35; --line:#2c2c2e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 15px/1.4 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .total { font-size: 15px; color: var(--mute); margin-bottom: 14px; }
  .total b { color: var(--ink); font-size: 28px; margin-right: 2px; }
  .card { background: var(--card); border-radius: 18px; padding: 10px 14px 12px; margin-bottom: 12px; }
  .year { font-weight: 800; font-size: 14px; color: var(--mute); margin: 4px 0 6px; display:flex; justify-content:space-between; }
  .row { display: grid; grid-template-columns: 34px 1fr 44px; align-items: center; gap: 8px; height: 30px; }
  .m { font-weight: 700; text-align: right; color: var(--mute); }
  .track { height: 18px; background: var(--line); border-radius: 9px; overflow: hidden; }
  .fill { height: 100%; background: var(--bar); border-radius: 9px; min-width: 4px; }
  .row.zero .fill { background: transparent; }
  .n { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
  .n small { font-weight: 600; color: var(--mute); font-size: 11px; margin-left: 1px; }
  .empty { color: var(--mute); padding: 30px 0; text-align: center; }
  .note { color: var(--mute); font-size: 12px; margin-top: 16px; }
  .run { display:block; text-align:center; background:#ff6b81; color:#fff; font-weight:800; font-size:17px; text-decoration:none; border-radius:14px; padding:14px; margin: 0 0 6px; }
  .when { color: var(--mute); font-size: 12px; text-align:center; margin-bottom: 14px; }
  details { color: var(--mute); font-size: 13px; margin-top: 14px; }
  details input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>L判印刷 月別の枚数</h1>
  <div class="total" id="total"></div>
  <a id="run" class="run" href="#">⟳ アルバムから数え直す</a>
  <div class="when" id="when"></div>
  <div id="chart"></div>
  <p class="note">「数え直す」を押すと、ショートカットが写真アプリの「L判印刷」アルバムを数えて、このページを開き直します。数はこのページの中だけで使い、どこにも送りません。<br>
  このページを Safari の共有ボタン →「ホーム画面に追加」しておくと、アプリのように開けます。</p>
  <details><summary>ショートカットの名前を変えたとき</summary>
    <input id="scName" autocomplete="off"></details>
</main>
<script>
  const store = { get(k) { try { return localStorage.getItem("lcount." + k); } catch { return null; } }, set(k, v) { try { localStorage.setItem("lcount." + k, v); } catch {} } };
  const scName = document.getElementById("scName");
  scName.value = store.get("name") || "L判月別枚数";
  const setRun = () => { document.getElementById("run").href = "shortcuts://run-shortcut?name=" + encodeURIComponent(scName.value.trim() || "L判月別枚数"); };
  scName.oninput = () => { store.set("name", scName.value.trim()); setRun(); };
  setRun();
  let raw = "";
  try { raw = decodeURIComponent(location.hash.slice(1)); } catch { raw = location.hash.slice(1); }
  // ショートカットから来たときは保存、そのまま開いたときは前回の結果を出す
  if (/\d{4}/.test(raw)) { store.set("last", raw); store.set("at", String(Date.now())); }
  else raw = store.get("last") || "";
  // 同じタブで開き直されたとき（# の後ろだけ変わる）も新しい数で描き直す
  addEventListener("hashchange", () => location.reload());
  const at = Number(store.get("at"));
  document.getElementById("when").textContent = at ? `最後に数えた日時：${new Date(at).toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}` : "";
  const counts = {};
  for (const m of raw.matchAll(/(\d{4})\D{1,3}(\d{1,2})\D+?(\d+)/g)) {
    const key = `${m[1]}-${m[2].padStart(2, "0")}`;
    counts[key] = (counts[key] || 0) + Number(m[3]);
  }
  const keys = Object.keys(counts).sort();
  const chart = document.getElementById("chart");
  if (!keys.length) {
    chart.innerHTML = '<div class="card empty">まだ数がありません。<br>上の「アルバムから数え直す」を押してください。</div>';
  } else {
    // 最初の月から最後の月まで、0枚の月も入れる
    const months = [];
    let [y, mo] = keys[0].split("-").map(Number);
    const [ly, lm] = keys[keys.length - 1].split("-").map(Number);
    while (y < ly || (y === ly && mo <= lm)) { months.push(`${y}-${String(mo).padStart(2, "0")}`); if (++mo > 12) { mo = 1; y++; } }
    const max = Math.max(...Object.values(counts));
    const total = Object.values(counts).reduce((a, b) => a + b, 0);
    document.getElementById("total").innerHTML = `合計 <b>${total}</b>枚 ・ ${months.length}か月`;
    const byYear = {};
    for (const k of months) (byYear[k.slice(0, 4)] ||= []).push(k);
    chart.innerHTML = Object.entries(byYear).map(([yr, ms]) => {
      const sum = ms.reduce((a, k) => a + (counts[k] || 0), 0);
      return `<div class="card"><div class="year"><span>${yr}年</span><span>${sum}枚</span></div>` +
        ms.map((k) => { const n = counts[k] || 0; return `<div class="row${n ? "" : " zero"}"><span class="m">${Number(k.slice(5))}月</span><div class="track"><div class="fill" style="width:${n / max * 100}%"></div></div><span class="n">${n}<small>枚</small></span></div>`; }).join("") +
        `</div>`;
    }).join("");
  }
</script>
</body>
</html>
